AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Healthcare Prior Authorization — Multi-Agent Durable Function with AgentCore
  Deploys the durable Lambda coordinator + 5 AgentCore specialist runtimes.

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    Timeout: 900
    MemorySize: 2048

Resources:
  # ─── IAM Role for AgentCore runtimes ────────────────────────────────────────
  AgentCoreRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: healthcare-pa-agentcore-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
      Policies:
        - PolicyName: CloudWatchLogsPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*'
        - PolicyName: DurableCallbackPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:SendDurableExecutionCallbackSuccess
                  - lambda:SendDurableExecutionCallbackFailure
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:healthcare-pa-coordinator:*'
        - PolicyName: ECRPullPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/healthcare-pa/*'

  # ─── AgentCore Runtimes ─────────────────────────────────────────────────────
  DocumentAgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: healthcare_pa_document_agent
      Description: Extracts clinical facts and determines specialist routing
      RoleArn: !GetAtt AgentCoreRuntimeRole.Arn
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/healthcare-pa/document-agent:latest'
      NetworkConfiguration:
        NetworkMode: PUBLIC
      EnvironmentVariables:
        AWS_REGION: !Ref AWS::Region

  EligibilityAgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: healthcare_pa_eligibility_agent
      Description: Verifies patient insurance coverage and benefits
      RoleArn: !GetAtt AgentCoreRuntimeRole.Arn
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/healthcare-pa/eligibility-agent:latest'
      NetworkConfiguration:
        NetworkMode: PUBLIC
      EnvironmentVariables:
        AWS_REGION: !Ref AWS::Region

  PolicyAgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: healthcare_pa_policy_agent
      Description: Retrieves and interprets payer medical policy
      RoleArn: !GetAtt AgentCoreRuntimeRole.Arn
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/healthcare-pa/policy-agent:latest'
      NetworkConfiguration:
        NetworkMode: PUBLIC
      EnvironmentVariables:
        AWS_REGION: !Ref AWS::Region

  MedicalNecessityAgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: healthcare_pa_medical_necessity_agent
      Description: Compares clinical evidence against policy criteria
      RoleArn: !GetAtt AgentCoreRuntimeRole.Arn
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/healthcare-pa/medical-necessity-agent:latest'
      NetworkConfiguration:
        NetworkMode: PUBLIC
      EnvironmentVariables:
        AWS_REGION: !Ref AWS::Region

  SynthesisAgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: healthcare_pa_synthesis_agent
      Description: Combines specialist findings into unified PA recommendation
      RoleArn: !GetAtt AgentCoreRuntimeRole.Arn
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/healthcare-pa/synthesis-agent:latest'
      NetworkConfiguration:
        NetworkMode: PUBLIC
      EnvironmentVariables:
        AWS_REGION: !Ref AWS::Region

  # ─── Durable Lambda Coordinator ─────────────────────────────────────────────
  CoordinatorFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - DocumentAgentRuntime
      - EligibilityAgentRuntime
      - PolicyAgentRuntime
      - MedicalNecessityAgentRuntime
      - SynthesisAgentRuntime
    Properties:
      FunctionName: healthcare-pa-coordinator
      Handler: src/handlers/coordinator.handler
      DurableConfig:
        ExecutionTimeout: 1209600  # 14 days
        RetentionPeriodInDays: 30
      Environment:
        Variables:
          DOCUMENT_AGENT_ARN: !GetAtt DocumentAgentRuntime.AgentRuntimeArn
          ELIGIBILITY_AGENT_ARN: !GetAtt EligibilityAgentRuntime.AgentRuntimeArn
          POLICY_AGENT_ARN: !GetAtt PolicyAgentRuntime.AgentRuntimeArn
          MEDICAL_NECESSITY_AGENT_ARN: !GetAtt MedicalNecessityAgentRuntime.AgentRuntimeArn
          SYNTHESIS_AGENT_ARN: !GetAtt SynthesisAgentRuntime.AgentRuntimeArn
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicDurableExecutionRolePolicy
        - Statement:
            - Effect: Allow
              Action: bedrock-agentcore:InvokeAgentRuntime
              Resource:
                - !GetAtt DocumentAgentRuntime.AgentRuntimeArn
                - !Sub '${DocumentAgentRuntime.AgentRuntimeArn}/*'
                - !GetAtt EligibilityAgentRuntime.AgentRuntimeArn
                - !Sub '${EligibilityAgentRuntime.AgentRuntimeArn}/*'
                - !GetAtt PolicyAgentRuntime.AgentRuntimeArn
                - !Sub '${PolicyAgentRuntime.AgentRuntimeArn}/*'
                - !GetAtt MedicalNecessityAgentRuntime.AgentRuntimeArn
                - !Sub '${MedicalNecessityAgentRuntime.AgentRuntimeArn}/*'
                - !GetAtt SynthesisAgentRuntime.AgentRuntimeArn
                - !Sub '${SynthesisAgentRuntime.AgentRuntimeArn}/*'
      AutoPublishAlias: live
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/coordinator.ts]

  CoordinatorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/healthcare-pa-coordinator
      RetentionInDays: 30

  # ─── PA Demo API Gateway ──────────────────────────────────────────────────────
  PaDemoApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # ─── API Lambda Handlers ─────────────────────────────────────────────────────
  StartExecutionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/api/start-execution.handler
      Environment:
        Variables:
          COORDINATOR_FUNCTION_NAME: !Sub '${CoordinatorFunction.Arn}:live'
      Policies:
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt CoordinatorFunction.Arn
                - !Sub '${CoordinatorFunction.Arn}:*'
      Events:
        PostExecutions:
          Type: Api
          Properties:
            RestApiId: !Ref PaDemoApi
            Path: /executions
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/api/start-execution.ts]

  GetHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/api/get-history.handler
      Environment:
        Variables:
          COORDINATOR_FUNCTION_NAME: !Sub '${CoordinatorFunction.Arn}:live'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - lambda:GetDurableExecution
                - lambda:GetDurableExecutionHistory
              Resource:
                - !GetAtt CoordinatorFunction.Arn
                - !Sub '${CoordinatorFunction.Arn}:*'
      Events:
        GetHistory:
          Type: Api
          Properties:
            RestApiId: !Ref PaDemoApi
            Path: /executions/{executionArn}/history
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/api/get-history.ts]

  SendCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/api/send-callback.handler
      Environment:
        Variables:
          COORDINATOR_FUNCTION_NAME: !Sub '${CoordinatorFunction.Arn}:live'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - lambda:SendDurableExecutionCallbackSuccess
              Resource: '*'
      Events:
        PostCallback:
          Type: Api
          Properties:
            RestApiId: !Ref PaDemoApi
            Path: /executions/{executionArn}/callbacks/{callbackId}
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/api/send-callback.ts]

  ListExecutionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/api/list-executions.handler
      Environment:
        Variables:
          COORDINATOR_FUNCTION_NAME: !Sub '${CoordinatorFunction.Arn}:live'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - lambda:ListDurableExecutionsByFunction
              Resource:
                - !GetAtt CoordinatorFunction.Arn
                - !Sub '${CoordinatorFunction.Arn}:*'
      Events:
        GetExecutions:
          Type: Api
          Properties:
            RestApiId: !Ref PaDemoApi
            Path: /executions
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/api/list-executions.ts]

  # ─── Demo UI Static Website Hosting (CloudFront + OAC) ───────────────────────
  DemoUIBucket:
    Type: AWS::S3::Bucket

  DemoUIBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DemoUIBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${DemoUIBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DemoUIDistribution}'

  DemoUIOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-demo-ui-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DemoUIDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt DemoUIBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt DemoUIOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  CoordinatorFunctionArn:
    Description: Qualified ARN for invoking the PA coordinator
    Value: !Sub '${CoordinatorFunction.Arn}:live'
  DocumentAgentArn:
    Value: !GetAtt DocumentAgentRuntime.AgentRuntimeArn
  EligibilityAgentArn:
    Value: !GetAtt EligibilityAgentRuntime.AgentRuntimeArn
  PolicyAgentArn:
    Value: !GetAtt PolicyAgentRuntime.AgentRuntimeArn
  MedicalNecessityAgentArn:
    Value: !GetAtt MedicalNecessityAgentRuntime.AgentRuntimeArn
  SynthesisAgentArn:
    Value: !GetAtt SynthesisAgentRuntime.AgentRuntimeArn
  PaDemoApiUrl:
    Description: URL for the PA Demo API Gateway
    Value: !Sub 'https://${PaDemoApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
  DemoUIBucketUrl:
    Description: CloudFront URL for the Demo UI
    Value: !Sub 'https://${DemoUIDistribution.DomainName}'
  DemoUIBucketName:
    Description: Name of the S3 bucket for syncing UI assets
    Value: !Ref DemoUIBucket
